[project]
name = "aspish"
version = "0.6.0"
description = "Answer Set Programming with a friendly interface."
authors = [
    {name = "Matthias Ossadnik",email = "ossadnik.matthias@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha"
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "clingo (>=5.8.0,<6.0.0)",
    "attrs (>=25.1.0,<27.0.0)"
]

[tool.poetry]
packages = [{include = "aspish", from = "src"}]

[tool.poetry.urls]
homepage = "https://github.com/mossadnik/aspish"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
test = [
    "pytest (>=9.0.3,<10.0.0)"
]
dev = [
    "jupyter (>=1.1.1,<2.0.0)"
]
